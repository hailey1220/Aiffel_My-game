<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장보기 타임어택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 마트 진열대(왼쪽) + 영수증 모양 장보기 목록·장바구니(오른쪽), 폰에서는 목록→진열대→계산대 순서로 쌓임 */
:root {
  --bg: #e9f0ec;
  --surface: #ffffff;
  --shelf: #f6faf7;
  --ink: #12302a;
  --muted: #5b7069;
  --line: #cfdcd5;
  --accent: #0f7a5c;
  --accent-ink: #ffffff;
  --tag: #ffd23f;
  --tag-ink: #2a2300;
  --danger: #d23f2a;
  --ok: #1d8f4e;
  --paper: #fffdf6;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1915; --surface: #16251f; --shelf: #1b2e26; --ink: #e4eee8; --muted: #93a8a0;
    --line: #2b4038; --accent: #3cc39a; --accent-ink: #062218; --tag: #f2c230; --tag-ink: #2a2300;
    --danger: #ff6b55; --ok: #49cc7e; --paper: #1d2a24; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1915; --surface: #16251f; --shelf: #1b2e26; --ink: #e4eee8; --muted: #93a8a0;
  --line: #2b4038; --accent: #3cc39a; --accent-ink: #062218; --tag: #f2c230; --tag-ink: #2a2300;
  --danger: #ff6b55; --ok: #49cc7e; --paper: #1d2a24; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }

/* 상단 바 */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.brand .cartmark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 20px; }
.stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: grid; min-width: 74px; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 44px; font-size: 18px; }

/* 타이머 */
.timer { position: relative; height: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.timer .fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--accent); transition: width .1s linear, background .3s; }
.timer.low .fill { background: var(--danger); }
.timer .label { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ink); mix-blend-mode: normal; }
.timer .label em { font-style: normal; background: var(--surface); padding: 0 10px; border-radius: 999px; }
.timer.low { animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 30%, transparent); } }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }

/* 진열대 */
.store { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; min-height: 420px; }
.aisles { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
.aisle-tab { flex: 1 0 auto; background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px 9px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.aisle-tab .no { font-family: var(--font-mono); font-size: 11px; display: block; letter-spacing: .08em; }
.aisle-tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; padding: 14px; background: var(--shelf); }
.product { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 8px 10px; display: grid; justify-items: center; gap: 4px; transition: transform .08s; }
.product:hover { border-color: var(--accent); }
.product:active { transform: scale(.95); }
.product .emo { font-size: 38px; line-height: 1.1; }
.product .name { font-weight: 600; font-size: 14px; }
.product .price { font-family: var(--font-mono); font-size: 12px; background: var(--tag); color: var(--tag-ink); padding: 1px 6px; border-radius: 3px; font-variant-numeric: tabular-nums; }
.product .count { position: absolute; top: 6px; right: 6px; min-width: 22px; height: 22px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.product.bump { animation: bump .25s; }
@keyframes bump { 40% { transform: scale(1.08); } }

/* 영수증(장보기 목록 + 장바구니) */
.side { display: grid; gap: 14px; }
.receipt { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 16px 20px; font-family: var(--font-mono); position: relative;
  -webkit-mask: radial-gradient(circle 6px at 50% 100%, transparent 5.5px, #000 6px) 0 0 / 14px 100% repeat-x; mask: linear-gradient(#000 0 0); }
.receipt h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
.receipt .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.receipt .dash { border-top: 1px dashed var(--muted); margin: 8px 0; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.list li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; font-size: 14px; }
.list .box { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); }
.list li.done .box { background: var(--ok); border-color: var(--ok); }
.list li.done .what { text-decoration: line-through; color: var(--muted); }
.list li.over .qty { color: var(--danger); }
.list .hint { font-size: 11px; color: var(--muted); margin-left: 4px; }
.list .qty { font-variant-numeric: tabular-nums; }
.cart { display: flex; flex-wrap: wrap; gap: 6px; min-height: 34px; }
.cart .empty { font-size: 12px; color: var(--muted); align-self: center; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
.chip:hover { border-color: var(--danger); }
.chip.extra { border-color: var(--danger); color: var(--danger); }
.chip .x { color: var(--muted); font-size: 11px; }
.total { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.checkout { width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 24px; padding: 14px; }
.checkout:disabled { opacity: .45; cursor: default; }
.msg { min-height: 20px; font-size: 13px; color: var(--danger); font-weight: 600; }
.msg.good { color: var(--ok); }
.tip { font-size: 12px; color: var(--muted); }

/* 오버레이 */
.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); display: grid; place-items: center; padding: 20px; z-index: 5; backdrop-filter: blur(2px); }
.card { max-width: 400px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.card h1 { font-family: var(--font-display); font-weight: 400; font-size: 40px; margin: 0; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.card .big { font-family: var(--font-display); font-size: 54px; color: var(--accent); line-height: 1; }
.card .rows { width: 100%; font-family: var(--font-mono); font-size: 14px; display: grid; gap: 4px; text-align: left; border-block: 1px dashed var(--muted); padding: 8px 0; }
.card .rows div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.primary { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 22px; padding: 12px 28px; }
.rules { text-align: left; font-size: 14px; line-height: 1.7; color: var(--ink); margin: 0; padding-left: 20px; }

.flash { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="cartmark" aria-hidden="true">🛒</span>장보기 타임어택</div>
    <div class="stats">
      <div class="stat"><span>단계</span><b id="lvl">1</b></div>
      <div class="stat"><span>점수</span><b id="score">0</b></div>
      <div class="stat"><span>최고 기록</span><b id="best">0</b></div>
      <button class="iconbtn" id="sound" aria-label="소리 켜기/끄기" title="소리">🔊</button>
    </div>
  </header>

  <div class="timer" id="timer"><div class="fill" id="fill"></div><div class="label"><em id="tleft">0.0초</em></div></div>

  <div class="main">
    <section class="store" id="store">
      <div class="aisles" role="tablist" id="aisles"></div>
      <div class="shelf" id="shelf" role="tabpanel"></div>
      <div class="overlay" id="overlay"></div>
    </section>

    <aside class="side">
      <div class="receipt" id="receipt">
        <h2>꼭 사야 할 것</h2>
        <div class="sub" id="listsub">목록을 보고 진열대에서 담으세요</div>
        <ul class="list" id="list"></ul>
        <div class="dash"></div>
        <div class="sub">장바구니 · 누르면 하나 빼요</div>
        <div class="cart" id="cart"></div>
        <div class="dash"></div>
        <div class="total"><span>합계</span><span id="total">0원</span></div>
      </div>
      <button class="checkout" id="checkout" disabled>계산하기</button>
      <div class="msg" id="msg" role="status"></div>
      <div class="tip">목록에 없는 물건이 있거나 수량이 틀리면 계산대에서 5초를 잃어요. 비슷하게 생긴 상품을 조심하세요.</div>
    </aside>
  </div>
</div>

<script>
const AISLES = [
  { name: "과일·채소", items: [["apple","🍎","사과",2500],["gapple","🍏","풋사과",2300],["banana","🍌","바나나",3900],["grape","🍇","포도",7900],["straw","🍓","딸기",8900],["carrot","🥕","당근",1500],["potato","🥔","감자",2900],["sweetp","🍠","고구마",3500],["onion","🧅","양파",2000],["garlic","🧄","마늘",4500],["cabbage","🥬","배추",3800],["cucumber","🥒","오이",1200]] },
  { name: "음료·유제품", items: [["milk","🥛","우유",2800],["juice","🧃","주스",1800],["cola","🥤","콜라",1600],["bubble","🧋","버블티",3500],["coffee","☕","커피",2200],["tea","🍵","녹차",1900],["cheese","🧀","치즈",5400],["butter","🧈","버터",6200],["egg","🥚","계란",6900],["icecream","🍦","아이스크림",1500]] },
  { name: "정육·수산", items: [["beef","🥩","소고기",19800],["chicken","🍗","닭다리",8900],["bacon","🥓","베이컨",6500],["sausage","🌭","소시지",4800],["fish","🐟","생선",9900],["shrimp","🦐","새우",12900],["squid","🦑","오징어",7500],["crab","🦀","꽃게",15900],["octopus","🐙","문어",17500]] },
  { name: "빵·과자", items: [["bread","🍞","식빵",3200],["croissant","🥐","크루아상",2500],["bagel","🥯","베이글",2200],["cookie","🍪","쿠키",2900],["choco","🍫","초콜릿",1800],["candy","🍬","사탕",1200],["donut","🍩","도넛",1900],["cupcake","🧁","컵케이크",3300],["popcorn","🍿","팝콘",2700],["pretzel","🥨","프레첼",2400]] },
  { name: "생활용품", items: [["tissue","🧻","휴지",9900],["soap","🧼","비누",2500],["sponge","🧽","수세미",1500],["brush","🪥","칫솔",3200],["shampoo","🧴","샴푸",8900],["broom","🧹","빗자루",6500],["candle","🕯️","양초",4200],["battery","🔋","건전지",5900],["socks","🧦","양말",3000]] },
];
const PRODUCTS = {};
AISLES.forEach((a, ai) => a.items.forEach(([id, emo, name, price]) => PRODUCTS[id] = { id, emo, name, price, aisle: ai }));
const won = n => n.toLocaleString("ko-KR") + "원";
const $ = id => document.getElementById(id);
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let best = 0;
try { best = Number(localStorage.getItem("shop-best")) || 0; } catch (e) {}
let muted = false;
try { muted = localStorage.getItem("shop-muted") === "1"; } catch (e) {}

const S = { level: 1, score: 0, list: [], cart: new Map(), order: [], aisle: 0, timeLeft: 0, timeTotal: 1, running: false, wrong: 0, last: 0 };

/* 효과음 */
let actx = null;
function beep(freq, dur = 0.08, type = "sine", vol = 0.08) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

function makeLevel(level) {
  const kinds = Math.min(3 + level - 1, 9);
  const all = shuffle(Object.keys(PRODUCTS));
  const list = all.slice(0, kinds).map(id => {
    let qty = 1;
    if (level >= 2 && Math.random() < 0.15 + level * 0.05) qty = 2 + (level >= 4 && Math.random() < 0.4 ? 1 : 0);
    return { id, qty };
  });
  const units = list.reduce((s, x) => s + x.qty, 0);
  const t = Math.max(units * 2.6 + 6, units * 4.2 + 12 - level * 1.6);
  return { list, time: Math.round(t) };
}

function startLevel() {
  const { list, time } = makeLevel(S.level);
  S.list = list; S.cart = new Map(); S.wrong = 0;
  S.order = AISLES.map(a => shuffle(a.items.map(i => i[0])));
  S.aisle = 0; S.timeLeft = time; S.timeTotal = time;
  $("msg").textContent = ""; $("msg").className = "msg";
  $("overlay").hidden = true;
  S.running = true; S.last = performance.now();
  renderAll();
  requestAnimationFrame(tick);
}

function tick(now) {
  if (!S.running) return;
  const dt = (now - S.last) / 1000; S.last = now;
  S.timeLeft = Math.max(0, S.timeLeft - dt);
  renderTimer();
  if (S.timeLeft <= 0) return gameOver();
  requestAnimationFrame(tick);
}

function renderTimer() {
  const pct = Math.max(0, S.timeLeft / S.timeTotal * 100);
  $("fill").style.width = pct + "%";
  $("tleft").textContent = S.timeLeft.toFixed(1) + "초";
  $("timer").classList.toggle("low", S.running && S.timeLeft <= 5);
}

function renderStats() {
  $("lvl").textContent = S.level; $("score").textContent = S.score; $("best").textContent = best;
  $("sound").textContent = muted ? "🔇" : "🔊";
}

function renderAisles() {
  const el = $("aisles"); el.innerHTML = "";
  AISLES.forEach((a, i) => {
    const b = document.createElement("button");
    b.className = "aisle-tab"; b.setAttribute("role", "tab"); b.id = "tab-" + i;
    b.setAttribute("aria-selected", i === S.aisle ? "true" : "false");
    b.innerHTML = `<span class="no">${i + 1}번 통로</span>${a.name}`;
    b.onclick = () => { S.aisle = i; beep(520, 0.04, "triangle", 0.04); renderAisles(); renderShelf(); };
    el.appendChild(b);
  });
}

function renderShelf() {
  const el = $("shelf"); el.innerHTML = "";
  (S.order[S.aisle] || AISLES[S.aisle].items.map(i => i[0])).forEach(id => {
    const p = PRODUCTS[id];
    const b = document.createElement("button");
    b.className = "product"; b.id = "p-" + id;
    b.setAttribute("aria-label", `${p.name} 담기, ${won(p.price)}`);
    const c = S.cart.get(id) || 0;
    b.innerHTML = `<span class="emo" aria-hidden="true">${p.emo}</span><span class="name">${p.name}</span><span class="price">${won(p.price)}</span>${c ? `<span class="count">${c}</span>` : ""}`;
    b.onclick = () => addItem(id, b);
    el.appendChild(b);
  });
}

function renderList() {
  const el = $("list"); el.innerHTML = "";
  S.list.forEach(({ id, qty }) => {
    const p = PRODUCTS[id], have = S.cart.get(id) || 0;
    const li = document.createElement("li");
    if (have === qty) li.classList.add("done");
    if (have > qty) li.classList.add("over");
    const hint = S.level <= 2 ? `<span class="hint">${p.aisle + 1}번 통로</span>` : "";
    li.innerHTML = `<span class="box">${have === qty ? "✓" : ""}</span><span class="what">${p.emo} ${p.name}${hint}</span><span class="qty">${have}/${qty}</span>`;
    el.appendChild(li);
  });
  $("listsub").textContent = S.level <= 2 ? "처음 두 단계는 통로 번호를 알려줘요" : "이제 통로 힌트는 없어요";
}

function renderCart() {
  const el = $("cart"); el.innerHTML = "";
  const need = new Map(S.list.map(x => [x.id, x.qty]));
  let total = 0;
  if (!S.cart.size) el.innerHTML = `<span class="empty">아직 비어 있어요</span>`;
  S.cart.forEach((n, id) => {
    const p = PRODUCTS[id]; total += p.price * n;
    const b = document.createElement("button");
    b.className = "chip" + (!need.has(id) || n > need.get(id) ? " extra" : "");
    b.setAttribute("aria-label", `${p.name} 하나 빼기`);
    b.innerHTML = `<span aria-hidden="true">${p.emo}</span>${p.name} ×${n} <span class="x">✕</span>`;
    b.onclick = () => removeItem(id);
    el.appendChild(b);
  });
  $("total").textContent = won(total);
  $("checkout").disabled = !S.running || S.cart.size === 0;
}

function renderAll() { renderStats(); renderAisles(); renderShelf(); renderList(); renderCart(); renderTimer(); }

function addItem(id, btn) {
  if (!S.running) return;
  S.cart.set(id, (S.cart.get(id) || 0) + 1);
  const target = S.list.find(x => x.id === id);
  if (!target || S.cart.get(id) > target.qty) { S.wrong++; beep(220, 0.1, "square", 0.04); }
  else beep(S.cart.get(id) === target.qty ? 880 : 660, 0.07);
  renderShelf(); renderList(); renderCart();
  const nb = $("p-" + id); if (nb) { nb.classList.add("bump"); nb.focus({ preventScroll: true }); }
}

function removeItem(id) {
  if (!S.running) return;
  const n = (S.cart.get(id) || 0) - 1;
  if (n <= 0) S.cart.delete(id); else S.cart.set(id, n);
  beep(400, 0.05, "triangle", 0.05);
  renderShelf(); renderList(); renderCart();
}

function checkout() {
  if (!S.running) return;
  const missing = [], extra = [];
  S.list.forEach(({ id, qty }) => { const h = S.cart.get(id) || 0; if (h < qty) missing.push(`${PRODUCTS[id].name} ${qty - h}개`); });
  S.cart.forEach((n, id) => { const t = S.list.find(x => x.id === id); const over = n - (t ? t.qty : 0); if (over > 0) extra.push(`${PRODUCTS[id].name} ${over}개`); });
  if (!missing.length && !extra.length) return clearLevel();
  S.timeLeft = Math.max(0, S.timeLeft - 5);
  const parts = [];
  if (missing.length) parts.push("빠진 것: " + missing.join(", "));
  if (extra.length) parts.push("필요 없는 것: " + extra.join(", "));
  $("msg").className = "msg"; $("msg").textContent = "−5초 · " + parts.join(" / ");
  const r = $("receipt"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
  beep(160, 0.25, "sawtooth", 0.05);
}

function clearLevel() {
  S.running = false; renderTimer();
  const base = 100 * S.level, timeBonus = Math.round(S.timeLeft * 10), perfect = S.wrong === 0 ? 50 : 0;
  const gained = base + timeBonus + perfect;
  S.score += gained;
  if (S.score > best) { best = S.score; try { localStorage.setItem("shop-best", best); } catch (e) {} }
  renderStats(); renderCart();
  [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 90));
  showOverlay(`
    <h1>${S.level}단계 계산 완료</h1>
    <div class="big">+${gained}</div>
    <div class="rows">
      <div><span>단계 보너스</span><span>${base}</span></div>
      <div><span>남은 시간 ${S.timeLeft.toFixed(1)}초 × 10</span><span>${timeBonus}</span></div>
      <div><span>실수 없이 담기</span><span>${perfect ? 50 : "0 (" + S.wrong + "번 잘못 담음)"}</span></div>
    </div>
    <p>다음 단계는 목록이 길어지고 시간은 빠듯해져요.</p>
    <button class="primary" id="go">${S.level + 1}단계 시작</button>`, () => { S.level++; startLevel(); });
}

function gameOver() {
  S.running = false; renderTimer(); renderCart();
  const got = S.list.filter(({ id, qty }) => (S.cart.get(id) || 0) >= qty).length;
  beep(300, 0.15, "square", 0.05); setTimeout(() => beep(200, 0.3, "square", 0.05), 150);
  const isBest = S.score > 0 && S.score >= best;
  showOverlay(`
    <h1>마트 문 닫았어요</h1>
    <p>${S.level}단계에서 시간이 다 됐어요. 목록 ${S.list.length}개 중 ${got}개를 챙겼어요.</p>
    <div class="big">${S.score}점</div>
    <p>${isBest ? "새 최고 기록이에요!" : "최고 기록 " + best + "점"}</p>
    <button class="primary" id="go">처음부터 다시</button>`, () => { S.level = 1; S.score = 0; startLevel(); });
}

function showOverlay(html, onGo) {
  const o = $("overlay"); o.innerHTML = `<div class="card">${html}</div>`; o.hidden = false;
  const go = $("go"); go.onclick = onGo; go.focus({ preventScroll: true });
}

function intro() {
  S.order = AISLES.map(a => a.items.map(i => i[0]));
  S.list = [{ id: "milk", qty: 1 }, { id: "apple", qty: 2 }, { id: "bread", qty: 1 }];
  S.timeLeft = 22; S.timeTotal = 22;
  renderAll();
  showOverlay(`
    <h1>마트 마감까지 얼마 안 남았어요</h1>
    <ol class="rules">
      <li>오른쪽 목록에 적힌 물건을 정해진 수량만큼 담아요.</li>
      <li>위쪽 통로 탭을 눌러 코너를 옮겨 다녀요.</li>
      <li>다 담았으면 <b>계산하기</b>. 틀리면 5초가 깎여요.</li>
      <li>남은 시간이 많을수록 점수가 올라가요.</li>
    </ol>
    <button class="primary" id="go">장보기 시작</button>`, startLevel);
}

$("checkout").onclick = checkout;
$("sound").onclick = () => { muted = !muted; try { localStorage.setItem("shop-muted", muted ? "1" : "0"); } catch (e) {} renderStats(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.running) S.last = performance.now(); });
intro();
</script>
</body>
</html>
