<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Game 아케이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root {
  --bg: #f1f0ec; --surface: #ffffff; --ink: #1f2226; --muted: #646a70; --line: #dcdcd6;
  --shop: #0f7a5c; --shop-soft: #e3f1ea; --stage: #b3245a; --stage-soft: #f7e3ea;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141518; --surface: #1e2024; --ink: #eceef0; --muted: #9aa0a6; --line: #30333a;
    --shop: #3cc39a; --shop-soft: #17302a; --stage: #ff6fa3; --stage-soft: #34202a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding: 40px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 28px; }
h1 { margin: 0; font-size: 34px; letter-spacing: -0.5px; }
.lead { margin: 6px 0 0; color: var(--muted); line-height: 1.6; }
.games { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.game { display: grid; gap: 10px; padding: 22px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
  color: inherit; text-decoration: none; transition: transform .12s, border-color .12s; }
.game:hover, .game:focus-visible { transform: translateY(-2px); outline: none; }
.game .art { height: 120px; border-radius: 10px; display: grid; place-items: center; font-size: 54px; }
.game h2 { margin: 0; font-size: 26px; }
.game p { margin: 0; color: var(--muted); line-height: 1.6; font-size: 14px; }
.game .play { font-weight: 600; font-size: 15px; }
.shop .art { background: var(--shop-soft); } .shop h2 { font-family: "Do Hyeon", var(--font-body); font-weight: 400; } .shop .play { color: var(--shop); } .shop:hover, .shop:focus-visible { border-color: var(--shop); }
.stage .art { background: var(--stage-soft); } .stage h2 { font-family: "Gowun Batang", serif; } .stage .play { color: var(--stage); } .stage:hover, .stage:focus-visible { border-color: var(--stage); }
@media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>My Game</h1>
    <p class="lead">직접 기획하고 Claude Code와 함께 만든 브라우저 게임 모음이에요. PC와 휴대폰 어디서든 바로 플레이할 수 있어요.</p>
  </header>
  <section class="games">
    <a class="game shop" href="shopping/">
      <div class="art" aria-hidden="true">🛒</div>
      <h2>장보기 타임어택</h2>
      <p>마트를 돌아다니며 제한 시간 안에 목록의 상품을 담고 계산대로! 돌아다니는 손님과 단계마다 바뀌는 진열을 조심하세요.</p>
      <span class="play">플레이하기 →</span>
    </a>
    <a class="game stage" href="backstage/">
      <div class="art" aria-hidden="true">👗</div>
      <h2>백스테이지 퀵체인지</h2>
      <p>런웨이에서 돌아온 모델에게 룩 카드대로 옷을 빠르게 갈아입혀요. 비슷한 옷 함정과 동시에 들어오는 모델을 조심하세요.</p>
      <span class="play">플레이하기 →</span>
    </a>
  </section>
</main>
</body>
</html>
