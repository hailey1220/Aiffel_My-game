<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>백스테이지 퀵체인지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 위에서 내려다본 백스테이지(왼쪽 캔버스) + 피팅 패널·손에 든 옷·룩 보드(오른쪽). 폰에서는 피팅 패널이 지도 위에 뜸 */
:root {
  --bg: #f2ede8;
  --surface: #ffffff;
  --ink: #2a1c24;
  --muted: #76636d;
  --line: #e0d4d8;
  --accent: #b3245a;
  --accent-ink: #ffffff;
  --gold: #c9962e;
  --danger: #d23f2a;
  --ok: #23885a;
  --floor: #ebe3dc;
  --floor-line: #e1d7cf;
  --wall: #3a2a33;
  --curtain: #8e1f3c;
  --rack: #9a8f95;
  --rug: #f7d9e3;
  --card: #fffaf3;
  --font-display: "Gowun Batang", "Nanum Myeongjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17121a; --surface: #221a25; --ink: #f1e8ee; --muted: #a8949f; --line: #3a2d3c;
    --accent: #ff6fa3; --accent-ink: #2a0614; --gold: #e2b450; --danger: #ff6b55; --ok: #4fcf8e;
    --floor: #2a2230; --floor-line: #322838; --wall: #0c080d; --curtain: #a72a4c; --rack: #6f6470;
    --rug: #4a2a3a; --card: #2a2030; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17121a; --surface: #221a25; --ink: #f1e8ee; --muted: #a8949f; --line: #3a2d3c;
  --accent: #ff6fa3; --accent-ink: #2a0614; --gold: #e2b450; --danger: #ff6b55; --ok: #4fcf8e;
  --floor: #2a2230; --floor-line: #322838; --wall: #0c080d; --curtain: #a72a4c; --rack: #6f6470;
  --rug: #4a2a3a; --card: #2a2030; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--font-display); font-size: 28px; line-height: 1; display: flex; align-items: center; gap: 10px; }
.brand small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: .14em; display: block; margin-bottom: 4px; }
.stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: grid; min-width: 70px; }
.stat b { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.stat .hearts { color: var(--accent); letter-spacing: 2px; }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 44px; font-size: 18px; }
.home { font-size: 13px; color: var(--muted); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.store { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--wall); }
#map { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.controls { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.controls kbd { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

.side { display: grid; gap: 12px; min-width: 0; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.box h2 { margin: 0; font-family: var(--font-display); font-size: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.box h2 span { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 400; }
.hint { font-size: 12px; color: var(--muted); }

/* 손에 든 옷 */
.hands { display: flex; flex-wrap: wrap; gap: 6px; min-height: 52px; }
.hand-item { width: 52px; height: 52px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); display: grid; place-items: center; padding: 4px; touch-action: none; position: relative; }
.hand-item:hover { border-color: var(--accent); }
.hand-item.empty { border-style: dashed; background: transparent; cursor: default; }
.hand-item svg { width: 40px; height: 40px; pointer-events: none; }
.ghost { position: fixed; z-index: 50; width: 60px; height: 60px; pointer-events: none; transform: translate(-50%, -50%) scale(1.1); filter: drop-shadow(0 6px 10px rgba(0,0,0,.3)); }

/* 피팅 패널 */
.fitting { border-color: var(--accent); }
.fitting.floating { position: absolute; left: 6px; right: 6px; bottom: 6px; z-index: 4; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-height: 74%; overflow: auto; padding: 8px 10px; gap: 6px; }
.floating .hint { display: none; }
.floating .hand-item { width: 44px; height: 44px; }
.floating .hand-item svg { width: 34px; height: 34px; }
.floating .fit-head b { font-size: 16px; }
.floating .send { font-size: 15px; padding: 7px; }
@media (max-width: 520px) {
  .stats { margin-left: 0; gap: 6px; }
  .stat { min-width: 0; padding: 4px 9px; }
  .stat b { font-size: 16px; }
  .brand { font-size: 24px; }
}
.fit-grid { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: start; }
.floating .fit-grid { grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
.mannequin { position: relative; width: 100%; aspect-ratio: 3 / 4; background: var(--rug); border-radius: 10px; }
.mannequin.over { outline: 3px dashed var(--accent); outline-offset: -3px; }
.mannequin > svg.body { position: absolute; inset: 0; width: 100%; height: 100%; }
.slot { position: absolute; transform: translateX(-50%); display: grid; place-items: center; aspect-ratio: 1; border-radius: 8px; background: none; border: 0; padding: 0; }
.slot svg { width: 100%; height: 100%; }
.slot.empty { border: 2px dashed color-mix(in srgb, var(--muted) 60%, transparent); }
.slot.empty span { font-size: 10px; color: var(--muted); }
.floating .slot.empty span { font-size: 8px; }
.s-hat { top: 0; left: 50%; width: 32%; z-index: 3; }
.s-outer { top: 20%; left: 50%; width: 70%; z-index: 1; }
.s-top { top: 23%; left: 50%; width: 48%; z-index: 2; }
.s-bottom { top: 52%; left: 50%; width: 48%; z-index: 2; }
.s-shoes { top: 82%; left: 50%; width: 26%; z-index: 2; }
.s-acc-bag { top: 44%; left: 86%; width: 28%; z-index: 4; }
.fit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.fit-head b { font-family: var(--font-display); font-size: 20px; }
.ftime { font-family: var(--font-mono); font-size: 18px; font-variant-numeric: tabular-nums; color: var(--accent); }
.ftime.low { color: var(--danger); }
.acts { display: grid; gap: 6px; }
.acts kbd { font-family: var(--font-mono); font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .8; margin-left: 4px; }
.wearall { width: 100%; border: 1px solid var(--accent); border-radius: 8px; background: transparent; color: var(--accent); font-family: var(--font-display); font-size: 17px; padding: 8px; }
.wearall:disabled { opacity: .4; cursor: default; }
.floating .wearall { font-size: 15px; padding: 6px; }
@media (hover: none) { .acts kbd { display: none; } }
.send { width: 100%; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 18px; padding: 10px; }

/* 룩 카드 */
.look { list-style: none; margin: 0; padding: 8px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 4px; font-family: var(--font-mono); font-size: 13px; }
.look li { display: grid; grid-template-columns: 24px 1fr 16px; gap: 6px; align-items: center; }
.look li svg { width: 24px; height: 24px; }
.look li.ok { color: var(--ok); }
.look li .mark { font-weight: 700; }
.look.hidden { place-items: center; text-align: center; color: var(--muted); font-family: var(--font-body); }
.peek { border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.floating .look { font-size: 12px; padding: 6px 8px; }

/* 룩 보드 */
.board { display: grid; gap: 8px; }
.mcard { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
.mcard .who { font-weight: 700; }
.mcard .who small { color: var(--muted); font-weight: 400; margin-left: 4px; }
.mcard .mt { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.mcard .mt.low { color: var(--danger); font-weight: 700; }
.mcard .icons { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.mcard .icons svg { width: 26px; height: 26px; }
.mcard .icons .q { width: 26px; height: 26px; border-radius: 4px; background: var(--line); display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.mcard.walking { opacity: .7; }
.empty-note { font-size: 13px; color: var(--muted); }
.msg { min-height: 20px; font-size: 13px; font-weight: 600; color: var(--danger); }
.msg.good { color: var(--ok); }

.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 90%, transparent); display: grid; place-items: center; padding: 20px; z-index: 10; backdrop-filter: blur(2px); overflow: auto; }
.card { max-width: 440px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.card h1 { font-family: var(--font-display); font-size: 32px; margin: 0; line-height: 1.2; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.card .big { font-family: var(--font-mono); font-size: 46px; font-weight: 700; color: var(--accent); line-height: 1; }
.card .rows { width: 100%; font-family: var(--font-mono); font-size: 14px; display: grid; gap: 4px; text-align: left; border-block: 1px dashed var(--muted); padding: 8px 0; }
.card .rows div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.primary { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 20px; padding: 12px 28px; }
.rules { text-align: left; font-size: 14px; line-height: 1.7; color: var(--ink); margin: 0; padding-left: 20px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><div><small>BACKSTAGE · QUICK CHANGE</small>백스테이지 퀵체인지</div></div>
    <a class="home" href="../">← 게임 목록</a>
    <div class="stats">
      <div class="stat"><span>쇼</span><b id="lvl">1</b></div>
      <div class="stat"><span>룩</span><b id="looks">0/0</b></div>
      <div class="stat"><span>목숨</span><b class="hearts" id="lives">♥♥♥</b></div>
      <div class="stat"><span>점수</span><b id="score">0</b></div>
      <div class="stat"><span>최고 기록</span><b id="best">0</b></div>
      <button class="iconbtn" id="sound" aria-label="소리 켜기/끄기" title="소리">🔊</button>
    </div>
  </header>

  <div class="main">
    <div style="display:grid; gap:8px; min-width:0">
      <section class="store" id="store">
        <canvas id="map" tabindex="0" aria-label="백스테이지 지도. 방향키나 WASD로 움직이고, 가고 싶은 곳을 누르면 그곳까지 걸어가요."></canvas>
        <div class="overlay" id="overlay"></div>
      </section>
      <div class="controls">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
        <span>지도를 클릭·탭하면 그곳까지 걸어가요</span>
        <span>옷 위를 지나가면 손에 들어요 (최대 5벌)</span>
        <span>모델 옆에서 <kbd>Space</kbd> 전부 입히기 → 한 번 더 누르면 런웨이로</span>
      </div>
    </div>

    <aside class="side" id="side">
      <div class="box fitting" id="fitting"></div>
      <div class="box" id="handsBox">
        <h2>손에 든 옷 <span id="handsHint">누르면 행거에 되돌려놔요</span></h2>
        <div class="hands" id="hands"></div>
      </div>
      <div class="box">
        <h2>룩 보드 <span>지금 백스테이지에 있는 모델</span></h2>
        <div class="board" id="board"></div>
      </div>
      <div class="msg" id="msg" role="status"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- 옷 데이터 ---------- */
const SHAPES = {
  shirt:   { cat: "top",    name: "셔츠",   d: "M8.5 3 3 6l2 4.5 2.5-1.2V21h9V9.3l2.5 1.2L21 6l-5.5-3c-.6 1.6-1.9 2.6-3.5 2.6S9.1 4.6 8.5 3z" },
  pants:   { cat: "bottom", name: "바지",   d: "M6 3h12l1 18h-5.2L12 10.5 10.2 21H5L6 3z" },
  skirt:   { cat: "bottom", name: "스커트", d: "M8 4h8l4.5 16h-17L8 4z" },
  coat:    { cat: "outer",  name: "코트",   d: "M8 2.5 3.5 5.5 3 21.5h8V8.5L8 2.5zM16 2.5l4.5 3 .5 16h-8V8.5l3-6z" },
  jacket:  { cat: "outer",  name: "재킷",   d: "M8 3 3.5 6 3 16h8V9L8 3zM16 3l4.5 3 .5 10h-8V9l3-6z" },
  sneaker: { cat: "shoes",  name: "운동화", d: "M2 14.5C2 12 3.5 9.5 5.5 9.5c1.2 0 2 2 5 2 1.8 0 2.8-1 4-1 3 0 7.5 3 7.5 6v2.5H2v-4.5z" },
  boots:   { cat: "shoes",  name: "부츠",   d: "M7 2.5h6.5V13l5.5 2.5c1.5.7 2.5 1.8 2.5 3.5v2.5H6V2.5z" },
  hat:     { cat: "acc",    name: "모자",   d: "M3 16.5c0-1.4 2.2-2.4 5-2.7V9.5C8 7.3 9.8 6 12 6s4 1.3 4 3.5v4.3c2.8.3 5 1.3 5 2.7 0 1.6-4 2.5-9 2.5s-9-.9-9-2.5z" },
  bag:     { cat: "acc",    name: "가방",   d: "M4.5 9h15L18 21H6L4.5 9zM8.8 9V7a3.2 3.2 0 0 1 6.4 0v2h-1.6V7a1.6 1.6 0 0 0-3.2 0v2H8.8z" },
};
const CATS = { top: "상의", bottom: "하의", outer: "아우터", shoes: "신발", acc: "액세서리" };
const CAT_ORDER = ["acc", "outer", "top", "bottom", "shoes"];
const COLORS = {
  red: ["빨강", "#d94141"], orange: ["주황", "#ef8a2c"], yellow: ["노랑", "#f2c230"], green: ["초록", "#3f9a5a"],
  blue: ["파랑", "#3a6fd8"], navy: ["남색", "#25366a"], purple: ["보라", "#8a5cc8"], pink: ["분홍", "#ec8db8"],
  black: ["검정", "#26262b"], white: ["흰색", "#f6f5f0"], beige: ["베이지", "#d8c3a0"],
};
// 헷갈리기 쉬운 색끼리 묶어 함정 옷을 만듦
const NEAR = { red: ["pink", "orange"], orange: ["red", "yellow"], yellow: ["orange", "beige"], green: ["navy", "blue"], blue: ["navy", "purple"], navy: ["blue", "black"], purple: ["navy", "pink"], pink: ["red", "purple"], black: ["navy"], white: ["beige"], beige: ["white", "yellow"] };
const PATTERNS = { solid: "", stripe: "줄무늬", dot: "물방울", check: "체크" };
const shapesOf = cat => Object.keys(SHAPES).filter(s => SHAPES[s].cat === cat);
const itemName = it => `${COLORS[it.color][0]} ${PATTERNS[it.pattern] ? PATTERNS[it.pattern] + " " : ""}${SHAPES[it.shape].name}`;
const same = (a, b) => a && b && a.shape === b.shape && a.color === b.color && a.pattern === b.pattern;
const MODEL_NAMES = ["지수", "민호", "하린", "도윤", "서아", "유진", "태오", "나래", "시우", "예린", "준", "다온"];

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (x, y) => x + "," + y;
let uidSeq = 1;
const lum = hex => { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; };

let best = 0, muted = false;
try { best = Number(localStorage.getItem("backstage-best")) || 0; muted = localStorage.getItem("backstage-muted") === "1"; } catch (e) {}
let actx = null;
function beep(freq, dur = 0.08, type = "sine", vol = 0.08) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* ---------- 옷 그림 (SVG · 캔버스 공용) ---------- */
function patternMarks(pattern) {
  if (pattern === "stripe") return [0, 4, 8, 12, 16, 20].map(y => `<rect x="0" y="${y + 1.2}" width="24" height="1.6"/>`).join("");
  if (pattern === "dot") { let s = ""; for (let y = 2; y < 24; y += 4.5) for (let x = (y / 4.5 % 2 ? 4 : 1.8); x < 24; x += 4.5) s += `<circle cx="${x}" cy="${y}" r="1"/>`; return s; }
  if (pattern === "check") { let s = ""; for (let v = 2; v < 24; v += 5) s += `<rect x="${v}" y="0" width="1.2" height="24"/><rect x="0" y="${v}" width="24" height="1.2"/>`; return s; }
  return "";
}
let clipSeq = 0;
function itemSVG(it) {
  const id = "c" + (clipSeq++), [, hex] = COLORS[it.color], mark = lum(hex) > 0.6 ? "rgba(40,30,40,.55)" : "rgba(255,255,255,.75)";
  const d = SHAPES[it.shape].d;
  return `<svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="${id}"><path d="${d}"/></clipPath></defs>
    <path d="${d}" fill="${hex}"/><g clip-path="url(#${id})" fill="${mark}">${patternMarks(it.pattern)}</g>
    <path d="${d}" fill="none" stroke="rgba(30,20,30,.55)" stroke-width="0.9" stroke-linejoin="round"/></svg>`;
}
const PATHS = {};
Object.entries(SHAPES).forEach(([k, s]) => PATHS[k] = new Path2D(s.d));
function drawItem(ctx, it, cx, cy, size) {
  const [, hex] = COLORS[it.color], mark = lum(hex) > 0.6 ? "rgba(40,30,40,.55)" : "rgba(255,255,255,.75)";
  const p = PATHS[it.shape];
  ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 24, size / 24);

/* ---------- 백스테이지 지도 ---------- */
const T = 32, W = 24, H = 16, R = 10, SPEED = 170, MODEL_SPEED = 95;

const START = { x: 12.5 * T, y: 7.5 * T };
const RACKS = [

  { cat: "top",    bars: [[2, 9, 8, 9]],   slots: [2, 3, 4, 5, 6, 7, 8].flatMap(x => [[x, 8], [x, 10]]) },
  { cat: "bottom", bars: [[15, 9, 21, 9]], slots: [15, 16, 17, 18, 19, 20, 21].flatMap(x => [[x, 8], [x, 10]]) },
  { cat: "outer",  bars: [[2, 14, 8, 14]], slots: [2, 3, 4, 5, 6, 7, 8].map(x => [x, 13]) },

const grid = [];
for (let y = 0; y < H; y++) { grid.push([]); for (let x = 0; x < W; x++) grid[y].push(x === 0 || y === 0 || x === W - 1 || y === H - 1 ? WALL : FLOOR); }

/* ---------- 게임 상태 ---------- */
const S = {
  level: 1, score: 0, lives: 3, running: false, t: 0, last: 0,
  slots: new Map(),   // "x,y" -> 옷
  hands: [],
  models: [], queue: [], nextSpawnAt: 0, done: 0, total: 0, ok: 0,
  p: { x: START.x, y: START.y, dir: { x: 0, y: 1 }, path: [], tile: "" },
  target: null, fitId: null,

const keys = new Set();

function levelRules(L) {
  const parts = L === 1 ? ["top", "bottom", "shoes"] : L === 2 ? ["top", "bottom", "shoes", "acc"] : ["top", "bottom", "outer", "shoes", "acc"];
  return {
    parts,

    gap: L === 1 ? 0 : L === 2 ? 10 : Math.max(5, 9 - L * 0.6),
    time: Math.max(24, Math.round(16 + parts.length * 5 - (L - 1) * 1.5 + (L === 1 ? 0 : L === 2 ? 6 : 12))),

}

function randItem(cat, patterns) {
  return { uid: uidSeq++, cat, shape: pick(shapesOf(cat)), color: pick(Object.keys(COLORS)), pattern: patterns && Math.random() < 0.5 ? pick(["stripe", "dot", "check"]) : "solid" };
}

  const what = pick(opts);

function setupShow() {
  const rules = levelRules(S.level);

  const names = shuffle(MODEL_NAMES);
  const looks = Array.from({ length: rules.looks }, (_, i) => {
    const look = {};
    rules.parts.forEach(c => look[c] = randItem(c, rules.patterns));
    return { name: names[i], look };
  });
  S.queue = looks; S.total = looks.length; S.done = 0; S.ok = 0;
  S.slots = new Map();
  RACKS.forEach(r => {
    const needed = looks.map(l => l.look[r.cat]).filter(Boolean).map(it => ({ ...it, uid: uidSeq++ }));
    const items = needed.slice();
    const cap = Math.min(r.slots.length, Math.max(needed.length + 3, 8));
    while (items.length < cap) items.push(needed.length ? decoyOf(pick(needed), rules.patterns) : randItem(r.cat, rules.patterns));
    shuffle(r.slots).slice(0, items.length).forEach(([x, y], i) => { const it = items[i]; it.home = key(x, y); S.slots.set(key(x, y), it); });

function startShow() {
  setupShow();
  S.models = []; S.hands = []; S.fitId = null; S.target = null;
  Object.assign(S.p, { x: START.x, y: START.y, dir: { x: 0, y: 1 }, path: [], tile: "" });

/* ---------- 모델 ---------- */
function freeStation() {
  const used = new Set(S.models.filter(m => m.state !== "out").map(m => m.station));
  const free = STATIONS.map((_, i) => i).filter(i => !used.has(i));
  return free.length ? pick(free) : -1;
}
function spawnModel() {
  const st = freeStation(); if (st < 0) return false;
  const q = S.queue.shift(), s = STATIONS[st];
  const cx = (CURTAIN.x0 + CURTAIN.x1 + 1) / 2 * T;
  S.models.push({
    id: uidSeq++, name: q.name, look: q.look, worn: {}, station: st, state: "in",
    x: cx, y: 0.6 * T, way: [{ x: cx, y: 2.5 * T }, { x: (s.x + .5) * T, y: 2.5 * T }, { x: (s.x + .5) * T, y: (s.y + .5) * T }],
    timeLeft: S.rules.time, timeTotal: S.rules.time, cardUntil: 0,

}
const cardVisible = m => S.rules.cardAlways || S.t < m.cardUntil;

function updateModels(dt) {
  for (const m of S.models) {
    if (m.way.length) {
      const w = m.way[0], vx = w.x - m.x, vy = w.y - m.y, d = Math.hypot(vx, vy);
      if (d < 1.5) {
        m.x = w.x; m.y = w.y; m.way.shift();
        if (!m.way.length && m.state === "in") { m.state = "fit"; m.cardUntil = S.t + 5; say(`${m.name} 모델이 피팅 ${m.station + 1}번에 도착했어요`, true); renderSide(); }
      } else { const st = Math.min(d, MODEL_SPEED * dt); m.x += vx / d * st; m.y += vy / d * st; }
    }

    if (spawnModel()) S.nextSpawnAt = S.t + S.rules.gap;

}

function check(m) {
  const wrong = [];

    const need = m.look[c], worn = m.worn[c];
    if (need && !worn) wrong.push(`${CATS[c]}을(를) 안 입었어요`);
    else if (need && !same(need, worn)) wrong.push(`${itemName(worn)} 말고 ${itemName(need)}`);
    else if (!need && worn) wrong.push(`${itemName(worn)}은(는) 필요 없어요`);
  }

}

function finishModel(m, timeout) {

    S.score += gained; S.ok++;
    say(`${m.name} 런웨이 완벽! +${gained}`, true);

  } else {

/* ---------- 옷 다루기 ---------- */
function returnToRack(it) {
  let k = it.home;
  if (S.slots.has(k)) {
    const r = RACKS.find(r => r.cat === it.cat);
    const free = r.slots.map(([x, y]) => key(x, y)).find(k2 => !S.slots.has(k2));

}
function wear(uid) {

  const i = S.hands.findIndex(h => h.uid === uid); if (i < 0) return;
  const [it] = S.hands.splice(i, 1);

}

  const batch = S.hands.slice();

}
// Space: 손에 옷이 있으면 전부 입히고, 없으면 런웨이로 내보내기

}

/* ---------- 스텝 이동 ---------- */
function hitsWall(x, y) {

}

  $("score").textContent = S.score; $("best").textContent = best; $("sound").textContent = muted ? "🔇" : "🔊";
  if (!dragging) renderFitting();
  renderHands($("hands"), false);
  $("handsHint").textContent = "누르면 행거에 되돌려놔요";
  renderBoard();
}
function tickSide() {
  for (const m of S.models) {
    if (m.state !== "fit") continue;
    const e = $("mt-" + m.id); if (e) { e.textContent = m.timeLeft.toFixed(1) + "초"; e.classList.toggle("low", m.timeLeft < 6); }
    if (m.id === S.fitId) { const f = $("ftime"); if (f) { f.textContent = m.timeLeft.toFixed(1) + "초"; f.classList.toggle("low", m.timeLeft < 6); } }
  }
}

/* ---------- 끌어다 입히기 ---------- */
let dragging = null;
function attachDrag(btn, uid) {
  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    const start = { x: e.clientX, y: e.clientY };
    let ghost = null;
    dragging = uid;
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 6) {
        ghost = document.createElement("div"); ghost.className = "ghost"; ghost.innerHTML = btn.innerHTML; document.body.appendChild(ghost);
      }
      if (ghost) {
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        const mq = $("mannequin"), over = mq && mq.contains(document.elementFromPoint(ev.clientX, ev.clientY));
        if (mq) mq.classList.toggle("over", !!over);
      }
    };
    const up = ev => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
      let ok = !ghost;
      if (ghost) { const mq = $("mannequin"); ok = mq && mq.contains(document.elementFromPoint(ev.clientX, ev.clientY)); ghost.remove(); }
      dragging = null;
      if (ok) wear(uid); else renderSide();
    };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up);
  });
}

/* ---------- 쇼 결과 ---------- */
function showClear() {
  S.running = false;
  const bonus = S.ok === S.total ? 300 * S.level : 0;
  S.score += bonus;
  if (S.score > best) { best = S.score; try { localStorage.setItem("backstage-best", best); } catch (e) {} }
  renderSide();
  [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, 0.12), i * 110));
  const next = levelRules(S.level + 1);
  showOverlay(`
    <h1>쇼 ${S.level} 피날레!</h1>
    <div class="big">${S.score}점</div>
    <div class="rows">
      <div><span>완벽하게 내보낸 룩</span><span>${S.ok} / ${S.total}</span></div>
      <div><span>전원 완벽 보너스</span><span>${bonus ? "+" + bonus : "없음"}</span></div>
      <div><span>남은 목숨</span><span>${"♥".repeat(S.lives)}</span></div>
    </div>
    <p>다음 쇼: 모델 ${next.looks}명, 동시에 최대 ${next.maxConc}명${!next.cardAlways ? ", 룩 카드는 도착 후 5초만 보여요" : ""}${next.parts.length > S.rules.parts.length ? ", 입힐 옷이 늘어나요" : ""}.</p>
    <button class="primary" id="go">쇼 ${S.level + 1} 시작</button>`, () => { S.level++; startShow(); });
}
function gameOver() {
  S.running = false;
  const isBest = S.score > 0 && S.score >= best;
  beep(300, 0.15, "square", 0.05); setTimeout(() => beep(200, 0.3, "square", 0.05), 150);
  showOverlay(`
    <h1>쇼가 중단됐어요</h1>
    <p>쇼 ${S.level}에서 목숨을 모두 잃었어요. 이번 쇼에서 ${S.ok}벌을 완벽하게 내보냈어요.</p>
    <div class="big">${S.score}점</div>
    <p>${isBest ? "새 최고 기록이에요!" : "최고 기록 " + best + "점"}</p>
    <button class="primary" id="go">처음부터 다시</button>`, () => { S.level = 1; S.score = 0; S.lives = 3; startShow(); });
}
function showOverlay(html, onGo) {
  const o = $("overlay"); o.innerHTML = `<div class="card">${html}</div>`; o.hidden = false;
  const go = $("go"); go.onclick = onGo; go.focus({ preventScroll: true });
}

/* ---------- 그리기 ---------- */
const canvas = $("map"), ctx = canvas.getContext("2d");
let C = {}, view = { w: W, h: H }, cam = { x: 0, y: 0 };
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  ["--floor", "--floor-line", "--wall", "--curtain", "--rack", "--rug", "--accent", "--gold", "--danger", "--surface", "--ink", "--muted", "--card"].forEach(n => C[n] = cs.getPropertyValue(n).trim());
}
const narrow = () => (canvas.parentElement.clientWidth || 760) < 620;
function resize() {
  view = narrow() ? { w: 13, h: 12 } : { w: W, h: H };
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = view.w * T * dpr; canvas.height = view.h * T * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // 폰에서는 피팅 패널을 지도 위에 띄움
  const f = $("fitting"), mobile = window.matchMedia("(max-width: 900px)").matches;
  if (mobile && f.parentElement !== $("store")) { $("store").appendChild(f); f.classList.add("floating"); }
  if (!mobile && f.parentElement !== $("side")) { $("side").prepend(f); f.classList.remove("floating"); }
  renderFitting();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
const FONT = () => getComputedStyle(document.body).fontFamily;

function drawPerson(x, y, body, hair, dir, scale = 1) {
  ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(x, y + 9 * scale, 12 * scale, 5 * scale, 0, 0, 7); ctx.fill();
  ctx.fillStyle = body; ctx.beginPath(); ctx.arc(x, y, (R + 1) * scale, 0, 7); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C["--surface"]; ctx.stroke();
  ctx.fillStyle = "#f1cba6"; ctx.beginPath(); ctx.arc(x, y - 1, 6 * scale, 0, 7); ctx.fill();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(x - dir.x * 1.5, y - 2 - dir.y * 1.5, 5.6 * scale, Math.PI, 0); ctx.fill();
}

function draw() {
  const vw = view.w * T, vh = view.h * T;
  cam.x = Math.max(0, Math.min(W * T - vw, S.p.x - vw / 2));
  cam.y = Math.max(0, Math.min(H * T - vh, S.p.y - vh / 2));
  ctx.save(); ctx.translate(-cam.x, -cam.y);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    ctx.fillStyle = grid[y][x] === WALL ? C["--wall"] : C["--floor"]; ctx.fillRect(x * T, y * T, T, T);
    if (grid[y][x] !== WALL) { ctx.strokeStyle = C["--floor-line"]; ctx.lineWidth = 1; ctx.strokeRect(x * T + .5, y * T + .5, T - 1, T - 1); }
  }
  // 런웨이 커튼
  ctx.fillStyle = C["--curtain"]; ctx.fillRect(CURTAIN.x0 * T, 0, (CURTAIN.x1 - CURTAIN.x0 + 1) * T, T);
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 2;
  for (let x = CURTAIN.x0 * T + 8; x < (CURTAIN.x1 + 1) * T; x += 10) { ctx.beginPath(); ctx.moveTo(x, 2); ctx.lineTo(x, T - 2); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.font = `700 13px ${FONT()}`; ctx.fillText("▲ 런웨이", (CURTAIN.x0 + CURTAIN.x1 + 1) / 2 * T, T / 2);
  // 피팅 자리
  STATIONS.forEach((s, i) => {
    ctx.fillStyle = C["--rug"]; ctx.beginPath(); ctx.ellipse((s.x + .5) * T, (s.y + .5) * T, T * 1.1, T * .8, 0, 0, 7); ctx.fill();
    ctx.fillStyle = C["--rack"]; rr((s.x - .5) * T, (s.y - 1.25) * T, T * 2, 8, 3); ctx.fill(); // 거울
    ctx.fillStyle = C["--muted"]; ctx.font = `600 11px ${FONT()}`; ctx.fillText(`피팅 ${i + 1}`, (s.x + .5) * T, (s.y + 1.45) * T);
  });
  // 행거 · 신발장 · 액세서리 테이블
  RACKS.forEach(r => r.bars.forEach(([x0, y0, x1, y1]) => {
    ctx.fillStyle = C["--rack"]; rr(x0 * T + 2, y0 * T + 6, (x1 - x0 + 1) * T - 4, (y1 - y0 + 1) * T - 12, 5); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `700 11px ${FONT()}`;
    const label = { top: "상의 행거", bottom: "하의 행거", outer: "아우터 행거", shoes: "신발장", acc: "액세서리" }[r.cat];
    if (r.cat === "acc") { ctx.save(); ctx.translate((x0 + x1 + 1) / 2 * T, (y0 + y1 + 1) / 2 * T); ctx.rotate(-Math.PI / 2); ctx.fillText(label, 0, 0); ctx.restore(); }
    else ctx.fillText(label, (x0 + x1 + 1) / 2 * T, (y0 + .5) * T);
  }));
  // 옷
  for (const [k, it] of S.slots) {
    const [x, y] = k.split(",").map(Number);
    ctx.fillStyle = C["--card"]; rr(x * T + 3, y * T + 3, T - 6, T - 6, 6); ctx.fill();
    drawItem(ctx, it, (x + .5) * T, (y + .5) * T, 24);
  }
  if (S.target) {
    ctx.strokeStyle = C["--accent"]; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.arc((S.target.x + .5) * T, (S.target.y + .5) * T, 9 + Math.sin(S.t * 8) * 2, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  // 모델 · 스텝
  const people = [...S.models.map(m => ({ m, y: m.y })), { p: S.p, y: S.p.y }].sort((a, b) => a.y - b.y);
  for (const e of people) {
    if (e.m) {
      const m = e.m, top = m.worn.top || m.worn.outer;
      drawPerson(m.x, m.y, top ? COLORS[top.color][1] : "#c9bfc4", "#2b1d18", { x: 0, y: 1 }, 1.15);
      ctx.fillStyle = C["--ink"]; ctx.font = `700 12px ${FONT()}`; ctx.fillText(m.name, m.x, m.y - 24);
      if (m.state === "fit") {
        const f = m.timeLeft / m.timeTotal;
        ctx.lineWidth = 3; ctx.strokeStyle = f < 0.25 ? C["--danger"] : C["--gold"];
        ctx.beginPath(); ctx.arc(m.x, m.y, 16, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * f); ctx.stroke();
      }
    } else {
      const p = e.p;
      drawPerson(p.x, p.y, C["--accent"], "#3a2a20", p.dir.x || p.dir.y ? p.dir : { x: 0, y: 1 });
      ctx.fillStyle = C["--accent"]; ctx.font = `700 12px ${FONT()}`; ctx.fillText(`나 ${S.hands.length}/5`, p.x, p.y + 22);
    }
  }
  ctx.restore();
}

/* ---------- 루프 · 입력 ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - S.last) / 1000 || 0); S.last = now; S.t += dt;
  if (S.running) { updatePlayer(dt); updateModels(dt); tickSide(); }
  draw();
  requestAnimationFrame(frame);
}
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
window.addEventListener("keydown", e => {
  if (!S.running) return;
  if ((e.code === "Space" || e.code === "Enter") && !e.repeat && S.fitId !== null) {
    e.preventDefault();
    if (e.code === "Space") quickAction();
    else { const m = S.models.find(m => m.id === S.fitId); if (m) finishModel(m, false); }
    return;
  }
  const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); keys.add(k);
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
window.addEventListener("blur", () => keys.clear());
canvas.addEventListener("pointerdown", e => {
  if (!S.running) return;
  const r = canvas.getBoundingClientRect();
  const lx = (e.clientX - r.left) / r.width * view.w * T + cam.x, ly = (e.clientY - r.top) / r.height * view.h * T + cam.y;
  let gx = Math.floor(lx / T), gy = Math.floor(ly / T);
  if (solid(gx, gy)) {
    const near = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([dx, dy]) => [gx + dx, gy + dy]).filter(([x, y]) => !solid(x, y))
      .sort((a, b) => Math.hypot((a[0] + .5) * T - lx, (a[1] + .5) * T - ly) - Math.hypot((b[0] + .5) * T - lx, (b[1] + .5) * T - ly))[0];
    if (!near) return; [gx, gy] = near;
  }
  S.p.path = findPath(Math.floor(S.p.x / T), Math.floor(S.p.y / T), gx, gy);
  S.target = S.p.path.length ? { x: gx, y: gy } : null;
});
$("sound").onclick = () => { muted = !muted; try { localStorage.setItem("backstage-muted", muted ? "1" : "0"); } catch (e) {} renderSide(); };
window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

function intro() {
  readTheme(); resize();
  S.rules = levelRules(1); setupShow(); renderSide();
  showOverlay(`
    <h1>쇼 시작 5분 전, 백스테이지</h1>
    <ol class="rules">
      <li>런웨이에서 돌아온 모델이 피팅 자리에 서면 <b>룩 카드</b>가 보여요.</li>
      <li>행거·신발장·액세서리 테이블을 돌며 카드에 맞는 옷 위를 지나가 손에 들어요. 한 번에 5벌까지 들 수 있어요.</li>
      <li>모델 옆에 서서 <b>Space</b>를 누르면 손에 든 옷을 한 번에 입혀요. 한 번 더 누르면 런웨이로 내보내요. 휴대폰에서는 <b>한 번에 입히기</b> 버튼을 누르세요.</li>
      <li>색·무늬만 다른 비슷한 옷을 조심하세요. 틀리거나 시간이 지나면 목숨이 하나 줄어요.</li>
    </ol>
    <button class="primary" id="go">쇼 시작</button>`, startShow);
  S.last = performance.now();
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.ready.then(readTheme);
intro();
</script>
</body>
</html>
