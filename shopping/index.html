<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장보기 타임어택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="cartmark" aria-hidden="true">🛒</span>장보기 타임어택</div>
    <a class="home" href="../" style="font-size:13px;color:var(--muted)">← 게임 목록</a>
    <div class="stats">
      <div class="stat"><span>단계</span><b id="lvl">1</b></div>
      <div class="stat"><span>점수</span><b id="score">0</b></div>
      <div class="stat"><span>최고 기록</span><b id="best">0</b></div>
      <button class="iconbtn" id="sound" aria-label="소리 켜기/끄기" title="소리">🔊</button>
    </div>
  </header>

  <div class="timer" id="timer"><div class="fill" id="fill"></div><div class="label"><em id="tleft">0.0초</em></div></div>

  <div class="main">
    <div style="display:grid; gap:8px; min-width:0">
      <section class="store" id="store">
        <canvas id="map" tabindex="0" aria-label="마트 지도. 방향키나 WASD로 움직이고, 가고 싶은 곳을 누르면 그곳까지 걸어가요."></canvas>
        <div class="overlay" id="overlay"></div>
      </section>
      <div class="controls">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
        <span>지도를 클릭·탭하면 그곳까지 걸어가요</span>
        <span>상품 위를 지나가면 자동으로 담겨요</span>
      </div>
    </div>

    <aside class="side">
      <div class="receipt" id="receipt">
        <h2>꼭 사야 할 것</h2>
        <div class="sub" id="listsub">목록에 있는 상품 위를 지나가세요</div>
        <ul class="list" id="list"></ul>
        <div class="dash"></div>
        <div class="total"><span>합계</span><span id="total">0원</span></div>
      </div>
      <div class="goal" id="goal">목록을 다 채우고 계산대로 가세요</div>
      <div class="msg" id="msg" role="status"></div>
    </aside>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
