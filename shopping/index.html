<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>장보기 타임어택</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 위에서 내려다본 마트 지도(왼쪽 캔버스) + 영수증 모양 장보기 목록(오른쪽), 폰에서는 목록 → 지도 순서로 쌓임 */
:root {
  --bg: #e9f0ec;
  --surface: #ffffff;
  --ink: #12302a;
  --muted: #5b7069;
  --line: #cfdcd5;
  --accent: #0f7a5c;
  --accent-ink: #ffffff;
  --tag: #ffc61a;
  --tag-ink: #2a2300;
  --danger: #d23f2a;
  --ok: #1d8f4e;
  --paper: #fffdf6;
  --floor: #f4f7f2;
  --floor-line: #e3eae3;
  --wall: #2f4a42;
  --shelf: #8a9a93;
  --shelf-ink: #ffffff;
  --c1: #3f9a3a; --c2: #2f7fd0; --c3: #d0503c; --c4: #d9902a; --c5: #8a5cc8;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "Nanum Gothic Coding", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1915; --surface: #16251f; --ink: #e4eee8; --muted: #93a8a0; --line: #2b4038;
    --accent: #3cc39a; --accent-ink: #062218; --tag: #f2c230; --tag-ink: #2a2300; --danger: #ff6b55;
    --ok: #49cc7e; --paper: #1d2a24; --floor: #1a2b24; --floor-line: #22362e; --wall: #070d0b;
    --shelf: #3d524a; --shelf-ink: #e4eee8;
    --c1: #5cc457; --c2: #5aa5ef; --c3: #f07563; --c4: #f0b04f; --c5: #b08ae8; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1915; --surface: #16251f; --ink: #e4eee8; --muted: #93a8a0; --line: #2b4038;
  --accent: #3cc39a; --accent-ink: #062218; --tag: #f2c230; --tag-ink: #2a2300; --danger: #ff6b55;
  --ok: #49cc7e; --paper: #1d2a24; --floor: #1a2b24; --floor-line: #22362e; --wall: #070d0b;
  --shelf: #3d524a; --shelf-ink: #e4eee8;
  --c1: #5cc457; --c2: #5aa5ef; --c3: #f07563; --c4: #f0b04f; --c5: #b08ae8; color-scheme: dark;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, canvas:focus-visible { outline: 3px solid var(--tag); outline-offset: 2px; }
.wrap { max-width: 1140px; margin: 0 auto; display: grid; gap: 14px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { font-family: var(--font-display); font-size: 30px; line-height: 1; display: flex; align-items: center; gap: 10px; }
.brand .cartmark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 20px; }
.stats { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; display: grid; min-width: 74px; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.iconbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; width: 44px; font-size: 18px; }

.timer { position: relative; height: 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.timer .fill { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--accent); transition: background .3s; }
.timer.low .fill { background: var(--danger); }
.timer .label { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; font-variant-numeric: tabular-nums; }
.timer .label em { font-style: normal; background: var(--surface); padding: 0 10px; border-radius: 999px; }
.timer.low { animation: pulse .6s ease-in-out infinite alternate; }
@keyframes pulse { to { box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 30%, transparent); } }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 14px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } .side { order: -1; } }

.store { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--wall); }
#map { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.controls { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.controls kbd { font-family: var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

.side { display: grid; gap: 12px; }
.receipt { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px; font-family: var(--font-mono); }
.receipt h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
.receipt .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.receipt .dash { border-top: 1px dashed var(--muted); margin: 10px 0; }
.list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.list li { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; font-size: 14px; }
.list .box { width: 20px; height: 20px; border: 2px solid var(--muted); border-radius: 4px; display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); }
.list li.done .box { background: var(--ok); border-color: var(--ok); }
.list li.done .what { text-decoration: line-through; color: var(--muted); }
.list .qty { font-variant-numeric: tabular-nums; }
.total { display: flex; justify-content: space-between; font-weight: 700; font-variant-numeric: tabular-nums; }
.goal { font-family: var(--font-display); font-size: 18px; padding: 10px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); }
.goal.ready { background: var(--tag); color: var(--tag-ink); border-color: var(--tag); }
.msg { min-height: 20px; font-size: 13px; color: var(--danger); font-weight: 600; }

.overlay { position: absolute; inset: 0; background: color-mix(in srgb, var(--surface) 90%, transparent); display: grid; place-items: center; padding: 20px; z-index: 5; backdrop-filter: blur(2px); overflow: auto; }
.card { max-width: 420px; width: 100%; text-align: center; display: grid; gap: 12px; justify-items: center; }
.card h1 { font-family: var(--font-display); font-weight: 400; font-size: 36px; margin: 0; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.card .big { font-family: var(--font-display); font-size: 54px; color: var(--accent); line-height: 1; }
.card .rows { width: 100%; font-family: var(--font-mono); font-size: 14px; display: grid; gap: 4px; text-align: left; border-block: 1px dashed var(--muted); padding: 8px 0; }
.card .rows div { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.primary { border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 22px; padding: 12px 28px; }
.rules { text-align: left; font-size: 14px; line-height: 1.7; color: var(--ink); margin: 0; padding-left: 20px; }
.flash { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><span class="cartmark" aria-hidden="true">🛒</span>장보기 타임어택</div>
    <a class="home" href="../" style="font-size:13px;color:var(--muted)">← 게임 목록</a>
    <div class="stats">
      <div class="stat"><span>단계</span><b id="lvl">1</b></div>
      <div class="stat"><span>점수</span><b id="score">0</b></div>
      <div class="stat"><span>최고 기록</span><b id="best">0</b></div>
      <button class="iconbtn" id="sound" aria-label="소리 켜기/끄기" title="소리">🔊</button>
    </div>
  </header>

  <div class="timer" id="timer"><div class="fill" id="fill"></div><div class="label"><em id="tleft">0.0초</em></div></div>

  <div class="main">
    <div style="display:grid; gap:8px; min-width:0">
      <section class="store" id="store">
        <canvas id="map" tabindex="0" aria-label="마트 지도. 방향키나 WASD로 움직이고, 가고 싶은 곳을 누르면 그곳까지 걸어가요."></canvas>
        <div class="overlay" id="overlay"></div>
      </section>
      <div class="controls">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
        <span>지도를 클릭·탭하면 그곳까지 걸어가요</span>
        <span>상품 위를 지나가면 자동으로 담겨요</span>
      </div>
    </div>

    <aside class="side">
      <div class="receipt" id="receipt">
        <h2>꼭 사야 할 것</h2>
        <div class="sub" id="listsub">목록에 있는 상품 위를 지나가세요</div>
        <ul class="list" id="list"></ul>
        <div class="dash"></div>
        <div class="total"><span>합계</span><span id="total">0원</span></div>
      </div>
      <div class="goal" id="goal">목록을 다 채우고 계산대로 가세요</div>
      <div class="msg" id="msg" role="status"></div>
    </aside>
  </div>
</div>

<script>
/* ---------- 데이터 ---------- */
const CATS = [
  { name: "과일·채소", color: "--c1", items: [["apple","🍎","사과",2500],["gapple","🍏","풋사과",2300],["banana","🍌","바나나",3900],["grape","🍇","포도",7900],["straw","🍓","딸기",8900],["carrot","🥕","당근",1500],["potato","🥔","감자",2900],["sweetp","🍠","고구마",3500],["onion","🧅","양파",2000],["garlic","🧄","마늘",4500]] },
  { name: "음료·유제품", color: "--c2", items: [["milk","🥛","우유",2800],["juice","🧃","주스",1800],["cola","🥤","콜라",1600],["bubble","🧋","버블티",3500],["coffee","☕","커피",2200],["tea","🍵","녹차",1900],["cheese","🧀","치즈",5400],["butter","🧈","버터",6200],["egg","🥚","계란",6900],["icecream","🍦","아이스크림",1500]] },
  { name: "정육·수산", color: "--c3", items: [["beef","🥩","소고기",19800],["chicken","🍗","닭다리",8900],["bacon","🥓","베이컨",6500],["sausage","🌭","소시지",4800],["fish","🐟","생선",9900],["shrimp","🦐","새우",12900],["squid","🦑","오징어",7500],["crab","🦀","꽃게",15900],["octopus","🐙","문어",17500]] },
  { name: "빵·과자", color: "--c4", items: [["bread","🍞","식빵",3200],["croissant","🥐","크루아상",2500],["bagel","🥯","베이글",2200],["cookie","🍪","쿠키",2900],["choco","🍫","초콜릿",1800],["candy","🍬","사탕",1200],["donut","🍩","도넛",1900],["cupcake","🧁","컵케이크",3300],["popcorn","🍿","팝콘",2700],["pretzel","🥨","프레첼",2400]] },
  { name: "생활용품", color: "--c5", items: [["tissue","🧻","휴지",9900],["soap","🧼","비누",2500],["sponge","🧽","수세미",1500],["brush","🪥","칫솔",3200],["shampoo","🧴","샴푸",8900],["broom","🧹","빗자루",6500],["candle","🕯️","양초",4200],["battery","🔋","건전지",5900],["socks","🧦","양말",3000]] },
];
const PRODUCTS = {};
CATS.forEach((c, ci) => c.items.forEach(([id, emo, name, price]) => PRODUCTS[id] = { id, emo, name, price, cat: ci }));

/* ---------- 매장 지도 ---------- */
const T = 32, W = 24, H = 16;
const FLOOR = 0, WALL = 1, SHELF = 2;
const SEGS = [[2, 10], [13, 21]];
const SHELF_ROWS = [1, 5, 9];
// 상품이 놓이는 줄: row = 상품 줄, shelf = 붙어 있는 선반 줄, half = 선반의 위(0)/아래(1) 절반에 이름표
const FACE_ROWS = [{ row: 2, shelf: 1, half: 1 }, { row: 4, shelf: 5, half: 0 }, { row: 6, shelf: 5, half: 1 }, { row: 8, shelf: 9, half: 0 }, { row: 10, shelf: 9, half: 1 }];
const PRODUCT_ROWS = new Set(FACE_ROWS.map(f => f.row));
const CHECKOUT = { x0: 17, x1: 21, y0: 13, y1: 14 };
const START = { x: 2.5 * T, y: 13.5 * T };
const SPEED = 140, NPC_SPEED = 68, R = 10;

const grid = [];
for (let y = 0; y < H; y++) {
  grid.push([]);
  for (let x = 0; x < W; x++) {
    let t = FLOOR;
    if (x === 0 || y === 0 || x === W - 1 || y === H - 1) t = WALL;
    else if (SHELF_ROWS.includes(y) && SEGS.some(([a, b]) => x >= a && x <= b)) t = SHELF;
    grid[y].push(t);
  }
}
const FACES = [];
FACE_ROWS.forEach(fr => SEGS.forEach(([a, b]) => FACES.push({ ...fr, x0: a, x1: b, slots: [0, 2, 4, 6, 8].map(d => a + d), cat: 0 })));

const solid = (tx, ty) => tx < 0 || ty < 0 || tx >= W || ty >= H || grid[ty][tx] !== FLOOR;
const inCheckout = (tx, ty) => tx >= CHECKOUT.x0 && tx <= CHECKOUT.x1 && ty >= CHECKOUT.y0 && ty <= CHECKOUT.y1;
const inSeg = x => SEGS.some(([a, b]) => x >= a && x <= b);
const isLane = (tx, ty) => !solid(tx, ty) && !(PRODUCT_ROWS.has(ty) && inSeg(tx));

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const won = n => n.toLocaleString("ko-KR") + "원";
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const key = (x, y) => x + "," + y;

let best = 0, muted = false;
try { best = Number(localStorage.getItem("shop-best")) || 0; muted = localStorage.getItem("shop-muted") === "1"; } catch (e) {}

let actx = null;
function beep(freq, dur = 0.08, type = "sine", vol = 0.08) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}

/* ---------- 게임 상태 ---------- */
const S = {
  level: 1, score: 0, list: [], cart: new Map(), itemAt: new Map(),
  timeLeft: 0, timeTotal: 1, running: false, wrong: 0, last: 0,
  p: { x: START.x, y: START.y, dir: { x: 1, y: 0 }, stun: 0, inv: 0, path: [], tile: "" },
  npcs: [], flashes: new Map(), target: null, t: 0,
};
const keys = new Set();

function layoutStore() {
  S.itemAt = new Map();
  const order = shuffle(FACES.map((_, i) => i));
  CATS.forEach((c, ci) => {
    const faces = [FACES[order[ci * 2]], FACES[order[ci * 2 + 1]]];
    faces.forEach(f => f.cat = ci);
    const slots = faces.flatMap(f => f.slots.map(x => ({ x, y: f.row })));
    shuffle(c.items).forEach((it, i) => { if (slots[i]) S.itemAt.set(key(slots[i].x, slots[i].y), it[0]); });
  });
}

function makeList(level) {
  const kinds = Math.min(2 + level, 9);
  const ids = shuffle([...S.itemAt.values()]).slice(0, kinds);
  return ids.map(id => {
    let qty = 1;
    if (level >= 2 && Math.random() < 0.12 + level * 0.05) qty = 2 + (level >= 4 && Math.random() < 0.35 ? 1 : 0);
    return { id, qty };
  });
}

function spawnNpcs(n) {
  const lanes = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (isLane(x, y) && Math.hypot(x + .5 - START.x / T, y + .5 - START.y / T) > 7) lanes.push({ x, y });
  const colors = ["#e07a5f", "#7b6cd9", "#3d8bd9", "#d9a23d", "#c2569b", "#4aa37a"];
  S.npcs = shuffle(lanes).slice(0, n).map((t, i) => ({ x: (t.x + .5) * T, y: (t.y + .5) * T, tx: t.x, ty: t.y, dir: { x: 0, y: 0 }, color: colors[i % colors.length] }));
}

function startLevel() {
  layoutStore();
  S.list = makeList(S.level);
  S.cart = new Map(); S.wrong = 0; S.flashes = new Map(); S.target = null;
  const units = S.list.reduce((s, x) => s + x.qty, 0);
  const time = Math.round(Math.max(10 + units * 3.5, 14 + units * 5 - S.level * 1.2));
  S.timeLeft = time; S.timeTotal = time;
  Object.assign(S.p, { x: START.x, y: START.y, dir: { x: 1, y: 0 }, stun: 0, inv: 0, path: [], tile: key(2, 13) });
  spawnNpcs(Math.min(S.level, 6));
  $("msg").textContent = "";
  $("overlay").hidden = true;
  keys.clear();
  S.running = true; S.last = performance.now();
  renderHud();
  $("map").focus({ preventScroll: true });
}

/* ---------- 이동 · 충돌 ---------- */
function hitsWall(x, y) {
  const x0 = Math.floor((x - R) / T), x1 = Math.floor((x + R - 0.01) / T);
  const y0 = Math.floor((y - R) / T), y1 = Math.floor((y + R - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) return true;
  return false;
}
function moveBy(e, mx, my) {
  if (!hitsWall(e.x + mx, e.y)) e.x += mx;
  else if (my === 0) { // 모서리에 걸리면 살짝 미끄러지게
    const cy = (Math.floor(e.y / T) + .5) * T, d = cy - e.y;
    if (Math.abs(d) > 0.5 && !hitsWall(e.x, e.y + Math.sign(d) * Math.min(Math.abs(d), Math.abs(mx)))) e.y += Math.sign(d) * Math.min(Math.abs(d), Math.abs(mx));
  }
  if (!hitsWall(e.x, e.y + my)) e.y += my;
  else if (mx === 0) {
    const cx = (Math.floor(e.x / T) + .5) * T, d = cx - e.x;
    if (Math.abs(d) > 0.5 && !hitsWall(e.x + Math.sign(d) * Math.min(Math.abs(d), Math.abs(my)), e.y)) e.x += Math.sign(d) * Math.min(Math.abs(d), Math.abs(my));
  }
}

function findPath(sx, sy, gx, gy) {
  const N = W * H, dist = new Array(N).fill(Infinity), prev = new Array(N).fill(-1), done = new Array(N).fill(false);
  const idx = (x, y) => y * W + x;
  dist[idx(sx, sy)] = 0;
  for (;;) {
    let u = -1, ud = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < ud) { ud = dist[i]; u = i; }
    if (u < 0) return [];
    if (u === idx(gx, gy)) break;
    done[u] = true;
    const ux = u % W, uy = (u / W) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = ux + dx, ny = uy + dy;
      if (solid(nx, ny)) continue;
      const isGoal = nx === gx && ny === gy;
      const cost = S.itemAt.has(key(nx, ny)) && !isGoal ? 30 : 1; // 지나가다 엉뚱한 상품을 담지 않도록 피해서 걷기
      const v = idx(nx, ny);
      if (ud + cost < dist[v]) { dist[v] = ud + cost; prev[v] = u; }
    }
  }
  const path = [];
  for (let v = idx(gx, gy); v !== idx(sx, sy); v = prev[v]) { if (v < 0) return []; path.push({ x: v % W, y: (v / W) | 0 }); }
  return path.reverse();
}

function updatePlayer(dt) {
  const p = S.p;
  p.inv = Math.max(0, p.inv - dt);
  if (p.stun > 0) { p.stun -= dt; return; }
  let dx = 0, dy = 0;
  if (keys.has("left")) dx -= 1; if (keys.has("right")) dx += 1;
  if (keys.has("up")) dy -= 1; if (keys.has("down")) dy += 1;
  if (dx || dy) {
    p.path = []; S.target = null;
    const len = Math.hypot(dx, dy);
    p.dir = { x: dx / len, y: dy / len };
    moveBy(p, dx / len * SPEED * dt, 0); moveBy(p, 0, dy / len * SPEED * dt);
  } else if (S.target && !p.path.length) {
    // 손님과 부딪혀 멈췄다면 원래 가던 곳으로 다시 길 찾기
    p.path = findPath(Math.floor(p.x / T), Math.floor(p.y / T), S.target.x, S.target.y);
    if (!p.path.length) S.target = null;
  } else if (p.path.length) {
    const n = p.path[0], cx = (n.x + .5) * T, cy = (n.y + .5) * T;
    const vx = cx - p.x, vy = cy - p.y, d = Math.hypot(vx, vy);
    if (d < 1.5) { p.path.shift(); if (!p.path.length) S.target = null; }
    else {
      const step = Math.min(d, SPEED * dt);
      p.dir = { x: vx / d, y: vy / d };
      p.x += vx / d * step; p.y += vy / d * step;
    }
  }
  const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T), k = key(tx, ty);
  if (k !== p.tile) { p.tile = k; onEnter(tx, ty); }
}

function updateNpcs(dt) {
  for (const n of S.npcs) {
    const cx = (n.tx + .5) * T, cy = (n.ty + .5) * T, vx = cx - n.x, vy = cy - n.y, d = Math.hypot(vx, vy);
    if (d < 1) {
      n.x = cx; n.y = cy;
      const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => isLane(n.tx + dx, n.ty + dy));
      let choices = opts.filter(([dx, dy]) => !(dx === -n.dir.x && dy === -n.dir.y));
      if (!choices.length) choices = opts;
      const straight = choices.find(([dx, dy]) => dx === n.dir.x && dy === n.dir.y);
      const [dx, dy] = straight && Math.random() < 0.7 ? straight : choices[Math.floor(Math.random() * choices.length)];
      n.dir = { x: dx, y: dy }; n.tx += dx; n.ty += dy;
    } else {
      const step = Math.min(d, NPC_SPEED * dt);
      n.x += vx / d * step; n.y += vy / d * step;
    }
    const p = S.p, gap = Math.hypot(p.x - n.x, p.y - n.y);
    if (gap < R * 2 + 2 && p.inv <= 0 && S.running) {
      p.stun = 0.7; p.inv = 1.6; p.path = [];
      const ux = (p.x - n.x) / (gap || 1), uy = (p.y - n.y) / (gap || 1);
      for (let i = 0; i < 6; i++) { moveBy(p, ux * 3, 0); moveBy(p, 0, uy * 3); }
      say("다른 손님과 부딪혔어요! 잠깐 멈춰요");
      beep(180, 0.15, "square", 0.05);
    }
  }
}

/* ---------- 담기 · 계산 ---------- */
function onEnter(tx, ty) {
  const id = S.itemAt.get(key(tx, ty));
  if (id) {
    const p = PRODUCTS[id], need = S.list.find(x => x.id === id), have = S.cart.get(id) || 0;
    if (!need) {
      S.wrong++; S.timeLeft = Math.max(0, S.timeLeft - 3);
      S.flashes.set(key(tx, ty), 0.6);
      say(`${p.name}은(는) 목록에 없어요. 3초 감점`);
      beep(200, 0.15, "square", 0.05);
      const r = $("receipt"); r.classList.remove("flash"); void r.offsetWidth; r.classList.add("flash");
    } else if (have < need.qty) {
      S.cart.set(id, have + 1);
      beep(have + 1 === need.qty ? 880 : 660, 0.08);
      say("");
      renderHud();
    }
  }
  if (inCheckout(tx, ty)) {
    if (allDone()) clearLevel();
    else say("아직 덜 담았어요. 목록을 확인하세요");
  }
}
const allDone = () => S.list.every(({ id, qty }) => (S.cart.get(id) || 0) >= qty);
function say(t) { $("msg").textContent = t; }

function clearLevel() {
  S.running = false;
  const base = 100 * S.level, timeBonus = Math.round(S.timeLeft * 10), perfect = S.wrong === 0 ? 50 : 0;
  const gained = base + timeBonus + perfect;
  S.score += gained;
  if (S.score > best) { best = S.score; try { localStorage.setItem("shop-best", best); } catch (e) {} }
  renderHud();
  [660, 880, 1100].forEach((f, i) => setTimeout(() => beep(f, 0.1), i * 90));
  showOverlay(`
    <h1>${S.level}단계 계산 완료</h1>
    <div class="big">+${gained}</div>
    <div class="rows">
      <div><span>단계 보너스</span><span>${base}</span></div>
      <div><span>남은 시간 ${S.timeLeft.toFixed(1)}초 × 10</span><span>${timeBonus}</span></div>
      <div><span>엉뚱한 상품 안 밟기</span><span>${perfect ? 50 : "0 (" + S.wrong + "번)"}</span></div>
    </div>
    <p>다음 단계는 진열이 바뀌고, 목록이 길어지고, 손님이 늘어나요.</p>
    <button class="primary" id="go">${S.level + 1}단계 시작</button>`, () => { S.level++; startLevel(); });
}

function gameOver() {
  S.running = false; renderHud();
  const got = S.list.filter(({ id, qty }) => (S.cart.get(id) || 0) >= qty).length;
  beep(300, 0.15, "square", 0.05); setTimeout(() => beep(200, 0.3, "square", 0.05), 150);
  const isBest = S.score > 0 && S.score >= best;
  showOverlay(`
    <h1>마트 문 닫았어요</h1>
    <p>${S.level}단계에서 시간이 다 됐어요. 목록 ${S.list.length}개 중 ${got}개를 챙겼어요.</p>
    <div class="big">${S.score}점</div>
    <p>${isBest ? "새 최고 기록이에요!" : "최고 기록 " + best + "점"}</p>
    <button class="primary" id="go">처음부터 다시</button>`, () => { S.level = 1; S.score = 0; startLevel(); });
}

function showOverlay(html, onGo) {
  const o = $("overlay"); o.innerHTML = `<div class="card">${html}</div>`; o.hidden = false;
  const go = $("go"); go.onclick = onGo; go.focus({ preventScroll: true });
}

/* ---------- HUD ---------- */
function renderHud() {
  $("lvl").textContent = S.level; $("score").textContent = S.score; $("best").textContent = best;
  $("sound").textContent = muted ? "🔇" : "🔊";
  const el = $("list"); el.innerHTML = "";
  let total = 0;
  S.list.forEach(({ id, qty }) => {
    const p = PRODUCTS[id], have = S.cart.get(id) || 0;
    total += p.price * have;
    const li = document.createElement("li");
    if (have >= qty) li.classList.add("done");
    li.innerHTML = `<span class="box">${have >= qty ? "✓" : ""}</span><span class="what">${p.emo} ${p.name}</span><span class="qty">${have}/${qty}</span>`;
    el.appendChild(li);
  });
  $("total").textContent = won(total);
  $("listsub").textContent = S.level <= 2 ? "노란 테두리가 찾아야 할 상품이에요" : "이제 힌트 테두리는 없어요";
  const ready = S.running && allDone();
  $("goal").textContent = ready ? "다 담았어요! 오른쪽 아래 계산대로 가세요" : "목록을 다 채우고 계산대로 가세요";
  $("goal").classList.toggle("ready", ready);
}
function renderTimer() {
  $("fill").style.width = Math.max(0, S.timeLeft / S.timeTotal * 100) + "%";
  $("tleft").textContent = S.timeLeft.toFixed(1) + "초";
  $("timer").classList.toggle("low", S.running && S.timeLeft <= 5);
}

/* ---------- 그리기 ---------- */
const canvas = $("map"), ctx = canvas.getContext("2d");
let C = {}, view = { w: W, h: H }, cam = { x: 0, y: 0 };
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  ["--floor", "--floor-line", "--wall", "--shelf", "--shelf-ink", "--accent", "--tag", "--danger", "--surface", "--ink", "--c1", "--c2", "--c3", "--c4", "--c5"]
    .forEach(n => C[n] = cs.getPropertyValue(n).trim());
}
function resize() {
  const w = canvas.parentElement.clientWidth || 760;
  view = w >= 620 ? { w: W, h: H } : { w: 13, h: 12 };
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = view.w * T * dpr; canvas.height = view.h * T * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

function drawPerson(x, y, color, dir, isPlayer) {
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(x, y + 9, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 카트
  const cx = x + dir.x * 14, cy = y + dir.y * 14;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.atan2(dir.y, dir.x));
  ctx.fillStyle = C["--surface"]; ctx.strokeStyle = isPlayer ? C["--accent"] : "rgba(80,90,90,.9)"; ctx.lineWidth = 2;
  rr(-5, -7, 13, 14, 3); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 몸
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, R + 1, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = C["--surface"]; ctx.stroke();
  ctx.fillStyle = "#f3cfa8"; ctx.beginPath(); ctx.arc(x, y - 1, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#3a2a20"; ctx.beginPath(); ctx.arc(x - dir.x * 1.5, y - 1 - dir.y * 1.5 - 1, 5.5, Math.PI, 0); ctx.fill();
}

function draw() {
  const vw = view.w * T, vh = view.h * T;
  cam.x = Math.max(0, Math.min(W * T - vw, S.p.x - vw / 2));
  cam.y = Math.max(0, Math.min(H * T - vh, S.p.y - vh / 2));
  ctx.save(); ctx.translate(-cam.x, -cam.y);

  // 바닥 · 벽
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = grid[y][x];
    ctx.fillStyle = t === WALL ? C["--wall"] : C["--floor"];
    ctx.fillRect(x * T, y * T, T, T);
    if (t === FLOOR) { ctx.strokeStyle = C["--floor-line"]; ctx.lineWidth = 1; ctx.strokeRect(x * T + .5, y * T + .5, T - 1, T - 1); }
  }
  // 입구
  ctx.fillStyle = C["--floor"]; ctx.fillRect(1.5 * T, 15 * T, 2 * T, T);
  ctx.fillStyle = C["--ink"]; ctx.font = `600 12px ${getComputedStyle(document.body).fontFamily}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("입구", 2.5 * T, 15.5 * T);

  // 계산대
  const ready = S.running && allDone();
  const pulse = ready ? 0.45 + 0.25 * Math.sin(S.t * 6) : 0.28;
  ctx.globalAlpha = pulse; ctx.fillStyle = C["--tag"];
  ctx.fillRect(CHECKOUT.x0 * T, CHECKOUT.y0 * T, (CHECKOUT.x1 - CHECKOUT.x0 + 1) * T, (CHECKOUT.y1 - CHECKOUT.y0 + 1) * T);
  ctx.globalAlpha = 1;
  for (const cx of [CHECKOUT.x0, CHECKOUT.x1]) { ctx.fillStyle = C["--shelf"]; rr(cx * T + 4, CHECKOUT.y0 * T + 4, T - 8, T * 2 - 8, 4); ctx.fill(); }
  ctx.fillStyle = C["--ink"]; ctx.font = `20px ${EMOJI}`; ctx.fillText("🧾", (CHECKOUT.x0 + .5) * T, (CHECKOUT.y0 + 1) * T);
  ctx.font = `400 22px "Do Hyeon", sans-serif`;
  ctx.fillText("계산대", (CHECKOUT.x0 + CHECKOUT.x1 + 1) / 2 * T, (CHECKOUT.y0 + 1) * T);

  // 선반 + 이름표
  for (const y of SHELF_ROWS) for (const [a, b] of SEGS) {
    ctx.fillStyle = C["--shelf"]; rr(a * T + 1, y * T + 3, (b - a + 1) * T - 2, T - 6, 5); ctx.fill();
  }
  ctx.font = `700 11px ${getComputedStyle(document.body).fontFamily}`;
  for (const f of FACES) {
    const col = C[CATS[f.cat].color];
    const yTop = f.shelf * T + 3 + (f.half ? (T - 6) / 2 : 0);
    ctx.fillStyle = col; ctx.fillRect(f.x0 * T + 1, yTop, (f.x1 - f.x0 + 1) * T - 2, (T - 6) / 2);
    ctx.fillStyle = "#ffffff"; ctx.fillText(CATS[f.cat].name, (f.x0 + f.x1 + 1) / 2 * T, yTop + (T - 6) / 4 + 0.5);
  }

  // 상품
  ctx.font = `21px ${EMOJI}`;
  for (const [k, id] of S.itemAt) {
    const [x, y] = k.split(",").map(Number), p = PRODUCTS[id];
    const need = S.list.find(n => n.id === id), have = S.cart.get(id) || 0, full = need && have >= need.qty;
    ctx.globalAlpha = 0.25; ctx.fillStyle = C[CATS[p.cat].color]; rr(x * T + 3, y * T + 3, T - 6, T - 6, 6); ctx.fill(); ctx.globalAlpha = 1;
    if (S.level <= 2 && need && !full) { ctx.strokeStyle = C["--tag"]; ctx.lineWidth = 3; rr(x * T + 2, y * T + 2, T - 4, T - 4, 7); ctx.stroke(); }
    const fl = S.flashes.get(k);
    if (fl) { ctx.strokeStyle = C["--danger"]; ctx.lineWidth = 3; rr(x * T + 2, y * T + 2, T - 4, T - 4, 7); ctx.stroke(); }
    ctx.globalAlpha = full ? 0.35 : 1;
    ctx.fillText(p.emo, (x + .5) * T, (y + .5) * T + 1);
    ctx.globalAlpha = 1;
  }

  // 목적지 표시
  if (S.target) {
    ctx.strokeStyle = C["--accent"]; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.arc((S.target.x + .5) * T, (S.target.y + .5) * T, 9 + Math.sin(S.t * 8) * 2, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  }

  // 사람들 (아래쪽에 있는 사람이 위에 보이게)
  const people = [...S.npcs.map(n => ({ ...n, isPlayer: false })), { ...S.p, color: C["--accent"], isPlayer: true }].sort((a, b) => a.y - b.y);
  for (const e of people) {
    const dir = e.dir.x || e.dir.y ? e.dir : { x: 0, y: 1 };
    if (e.isPlayer && e.inv > 0 && Math.floor(S.t * 12) % 2) ctx.globalAlpha = 0.5;
    drawPerson(e.x, e.y, e.color, dir, e.isPlayer);
    ctx.globalAlpha = 1;
    if (e.isPlayer) {
      ctx.fillStyle = C["--accent"]; ctx.font = `400 13px "Do Hyeon", sans-serif`; ctx.fillText("나", e.x, e.y - 20);
      if (e.stun > 0) { ctx.font = `14px ${EMOJI}`; ctx.fillText("💫", e.x + 10, e.y - 18); }
    }
  }
  ctx.restore();
}

/* ---------- 루프 ---------- */
function frame(now) {
  const dt = Math.min(0.05, (now - S.last) / 1000 || 0); S.last = now; S.t += dt;
  if (S.running) {
    S.timeLeft = Math.max(0, S.timeLeft - dt);
    updatePlayer(dt);
    if (S.running) updateNpcs(dt);
    for (const [k, v] of S.flashes) { if (v - dt <= 0) S.flashes.delete(k); else S.flashes.set(k, v - dt); }
    if (S.running && S.timeLeft <= 0) gameOver();
    renderHud();
  }
  renderTimer();
  draw();
  requestAnimationFrame(frame);
}

/* ---------- 입력 ---------- */
const KEYMAP = { ArrowUp: "up", KeyW: "up", ArrowDown: "down", KeyS: "down", ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right" };
window.addEventListener("keydown", e => {
  const k = KEYMAP[e.code]; if (!k || !S.running) return;
  e.preventDefault(); keys.add(k);
});
window.addEventListener("keyup", e => { const k = KEYMAP[e.code]; if (k) keys.delete(k); });
window.addEventListener("blur", () => keys.clear());
canvas.addEventListener("pointerdown", e => {
  if (!S.running) return;
  const r = canvas.getBoundingClientRect();
  const lx = (e.clientX - r.left) / r.width * view.w * T + cam.x, ly = (e.clientY - r.top) / r.height * view.h * T + cam.y;
  let gx = Math.floor(lx / T), gy = Math.floor(ly / T);
  if (solid(gx, gy)) {
    const near = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([dx, dy]) => [gx + dx, gy + dy]).filter(([x, y]) => !solid(x, y))
      .sort((a, b) => Math.hypot((a[0] + .5) * T - lx, (a[1] + .5) * T - ly) - Math.hypot((b[0] + .5) * T - lx, (b[1] + .5) * T - ly))[0];
    if (!near) return; [gx, gy] = near;
  }
  const sx = Math.floor(S.p.x / T), sy = Math.floor(S.p.y / T);
  S.p.path = findPath(sx, sy, gx, gy);
  S.target = S.p.path.length ? { x: gx, y: gy } : null;
});

$("sound").onclick = () => { muted = !muted; try { localStorage.setItem("shop-muted", muted ? "1" : "0"); } catch (e) {} renderHud(); };
window.addEventListener("resize", resize);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readTheme);
new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* ---------- 시작 화면 ---------- */
function intro() {
  readTheme(); resize();
  layoutStore();
  S.list = makeList(1);
  S.timeLeft = S.timeTotal = 30;
  spawnNpcs(2);
  renderHud();
  showOverlay(`
    <h1>마트 마감까지 얼마 안 남았어요</h1>
    <ol class="rules">
      <li>방향키·WASD로 움직이거나, 가고 싶은 곳을 클릭·탭하세요.</li>
      <li>목록에 있는 상품 위를 지나가면 장바구니에 담겨요. 2개가 필요하면 한 번 벗어났다가 다시 밟아요.</li>
      <li>목록에 없는 상품을 밟으면 3초가 깎여요.</li>
      <li>돌아다니는 손님과 부딪히면 잠깐 멈춰요.</li>
      <li>다 담았으면 오른쪽 아래 <b>계산대</b>로 가면 끝!</li>
    </ol>
    <button class="primary" id="go">장보기 시작</button>`, startLevel);
  S.last = performance.now();
  requestAnimationFrame(frame);
}
document.fonts && document.fonts.ready.then(() => readTheme());
intro();
</script>
</body>
</html>
